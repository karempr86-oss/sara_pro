<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملفي - عقارات برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--y:#FFD400;--bg:#07080A;--c:#0E0F12;--b:#1E1F25}
*{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff}
.header{height:60px;background:#08090B;border-bottom:1px solid #15161B;display:flex;align-items:center;justify-content:space-between;padding:0 3%}
.card{max-width:700px;margin:20px auto;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:20px;text-align:center}
.avatar{width:80px;height:80px;border-radius:50%;border:2px solid var(--y);margin:auto;display:block;object-fit:cover}
.grid{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
.pcard{background:#0E0F12;border:1px solid var(--b);border-radius:14px;overflow:hidden}
.pcard img{width:100%;height:140px;object-fit:cover}
.pcard .bd{padding:10px}
.btn{padding:8px 14px;border-radius:20px;font-weight:800;font-size:11px;border:none;cursor:pointer}
.btn-y{background:var(--y);color:#000}
.btn-r{background:#ff3b3b;color:#fff}
</style>
</head>
<body>
<div class="header">
<a href="index.html" style="color:#888;font-size:12px;text-decoration:none">← الرئيسية</a>
<div style="color:var(--y);font-weight:900">ملفي الشخصي</div>
<button onclick="logout()" style="background:transparent;border:1px solid #333;color:#777;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer">خروج</button>
</div>

<div class="card" id="userCard">جاري التحميل...</div>

<h3 style="max-width:1000px;margin:20px auto 10px;padding:0 16px">عقاراتي (<span id="count">0</span>)</h3>
<div class="grid" id="myGrid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",
  authDomain: "hack1-cb0f2.firebaseapp.com",
  projectId: "hack1-cb0f2",
  storageBucket: "hack1-cb0f2.firebasestorage.app",
  messagingSenderId: "926645598259",
  appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const userCard = document.getElementById('userCard');
const myGrid = document.getElementById('myGrid');

onAuthStateChanged(auth, async user=>{
  if(!user){
    const local = JSON.parse(localStorage.getItem('aqar_user')||localStorage.getItem('user')||'null');
    if(!local){ location.href='login.html'; return; }
    userCard.innerHTML = `<img class="avatar" src="https://ui-avatars.com/api/?name=${local.name||'User'}&background=FFD400&color=000"><h3 style="margin-top:10px">${local.name||local.email}</h3><p style="color:#777;font-size:11px">${local.email||''}</p>`;
    return;
  }
  userCard.innerHTML = `
    <img class="avatar" src="${user.photoURL||'https://ui-avatars.com/api/?name='+encodeURIComponent(user.displayName||'User')+'&background=FFD400&color=000'}">
    <h3 style="margin-top:10px">${user.displayName||'مستخدم'}</h3>
    <p style="color:#777;font-size:11px">${user.email}</p>
    <p style="color:#555;font-size:10px;margin-top:6px">${user.uid}</p>
  `;
  loadMyProps(user.uid);
});

async function loadMyProps(uid){
  myGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#666">جاري تحميل عقاراتك...</div>';
  try{
    const q = query(collection(db, "properties"), where("ownerId", "==", uid));
    const snap = await getDocs(q);
    const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    document.getElementById('count').innerText = list.length;
    if(!list.length){ myGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#666;padding:30px">لم تنشر أي عقار بعد<br><a href="add-property.html" style="color:var(--y)">+ أضف عقار</a></div>'; return; }
    myGrid.innerHTML = list.map(p=>`
      <div class="pcard">
        <img src="${p.imageUrl||'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400'}">
        <div class="bd">
          <div style="font-weight:800;font-size:12px">${p.title||''}</div>
          <div style="font-size:11px;color:var(--y);margin-top:4px">${Number(p.price||0).toLocaleString()} ج.م</div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="btn btn-y" style="flex:1" onclick="location.href='details.html?id=${p.id}'">عرض</button>
            <button class="btn btn-r" onclick="delProp('${p.id}')">حذف</button>
          </div>
        </div>
      </div>
    `).join('');
  }catch(e){
    myGrid.innerHTML = 'خطأ: '+e.message;
  }
}

window.delProp = async function(id){
  if(!confirm('تحذف العقار؟')) return;
  await deleteDoc(doc(db, "properties", id));
  location.reload();
}

window.logout = async function(){
  await signOut(auth);
  localStorage.removeItem('aqar_user'); localStorage.removeItem('user');
  location.href='index.html';
}
</script>
</body>
</html>
