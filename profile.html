<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الملف الشخصي - AL TAKRURY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#D4AF37;--gold2:#B8962E;--black:#050507;--card:#0E0E10;--b:#1E1E22}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo';-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:#fff;padding-bottom:80px}
.header{height:60px;background:rgba(5,5,7,.96);border-bottom:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.logo{color:var(--gold);font-weight:900;letter-spacing:1px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.head{background:var(--card);border:1px solid rgba(212,175,55,.2);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center}
.head img{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex-shrink:0}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;padding:10px 16px;border-radius:22px;font-size:12px;font-weight:800;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn-o{border:1px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:22px;font-size:12px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.edit-box{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.edit-box input{background:#121214;border:1px solid var(--b);border-radius:22px;padding:10px 14px;color:#fff;outline:none;font-size:12px;min-width:160px;flex:1;min-height:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.pc{background:#121214;border:1px solid var(--b);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:260px;transition:.2s}
.pc img{width:100%;height:130px;min-height:130px;object-fit:cover}
.pc.t{padding:10px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pc.t h4{font-size:11px;font-weight:700;height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:768px){.head{flex-direction:column;text-align:center}.grid{grid-template-columns:1fr 1fr}.edit-box{flex-direction:column}}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:#888;font-size:12px;text-decoration:none"><i class="fa-solid fa-house"></i> AL TAKRURY</a><div class="logo">ملفي</div><button onclick="logout()" style="background:transparent;border:none;color:#666;font-size:11px">خروج</button></div>
<div class="wrap"><div class="head" id="head">جاري التحميل...</div><h3 style="margin-top:18px;font-weight:900;display:flex;justify-content:space-between">عقاراته (<span id="cnt">0</span>) <a href="add-property.html" style="background:var(--gold);color:#000;padding:6px 14px;border-radius:18px;font-size:11px;font-weight:900">+ إضافة</a></h3><div class="grid" id="grid"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",authDomain:"hack1-cb0f2.firebaseapp.com",projectId:"hack1-cb0f2",storageBucket:"hack1-cb0f2.firebasestorage.app",messagingSenderId:"926645598259",appId:"1:926645598259:web:eabe7d3f588ee0b26f0b46"};
const IMGBB_KEY="4db587bdabc9b335c341251460d0d6e2";
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
const qId=new URLSearchParams(location.search).get('id');let currentUser=null;let targetUid=qId;
const headEl=document.getElementById('head');const gridEl=document.getElementById('grid');
onAuthStateChanged(auth,user=>{currentUser=user;if(!targetUid) targetUid=user?.uid;if(!targetUid){headEl.innerHTML=`مش مسجل دخول <a href="login.html" style="color:var(--gold)">دخول</a>`;return;}loadProfile(targetUid);});
async function uploadToImgBB(file){const fd=new FormData();fd.append("image",file);const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd});const data=await res.json();if(!data.success) throw new Error("فشل رفع الصورة");return data.data.url;}
async function loadProfile(uid){try{let name="مستخدم",email="",photo="",isMe=currentUser&&currentUser.uid===uid;if(isMe){name=currentUser.displayName||currentUser.email.split('@')[0];email=currentUser.email;photo=currentUser.photoURL;}else{const q=query(collection(db,"properties"),where("ownerId","==",uid));const snap=await getDocs(q);if(!snap.empty){const f=snap.docs[0].data();name=f.ownerName||name;photo=f.ownerPhoto||"";email=f.ownerEmail||"";}}
const av=photo||`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=D4AF37&color=000&size=80`;
headEl.innerHTML=`<img src="${av}"><div style="flex:1"><h2 style="font-weight:900">${name}</h2><p style="color:#666;font-size:11px">${email}</p>${isMe?`<div class="edit-box"><input id="newName" value="${name}"><button class="btn-gold" id="saveNameBtn"><i class="fa-solid fa-check"></i> حفظ</button></div><label class="btn-o" style="margin-top:10px;width:100%;justify-content:center"><i class="fa-solid fa-camera"></i> تغيير الصورة<input type="file" hidden id="avFile" accept="image/*"></label>`:`<div style="margin-top:10px"><a href="https://wa.me/201038204417" class="btn-gold" style="width:100%;justify-content:center">مراسلة</a></div>`}<div style="margin-top:8px;color:#666;font-size:11px"><b id="pc" style="color:#fff">0</b> عقار في AL TAKRURY</div></div>`;
if(isMe){document.getElementById('saveNameBtn').addEventListener('click',updateName);document.getElementById('avFile').addEventListener('change',e=>updateAvatar(e.target));}
const r2=query(collection(db,"properties"),where("ownerId","==",uid));const d2=await getDocs(r2);document.getElementById('cnt').innerText=d2.size;const pcEl=document.getElementById('pc');if(pcEl)pcEl.innerText=d2.size;
if(d2.empty){gridEl.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#666;padding:30px">لا يوجد عقارات</div>';return;}
gridEl.innerHTML=d2.docs.map(d=>{const p=d.data();const img=p.imageUrl||'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600';const title=(p.title||'عقار').substring(0,38);return `<div class="pc" onclick="location.href='details.html?id=${d.id}'"><img src="${img}"><div class="t"><h4>${title}</h4><div style="font-size:10px;color:var(--gold);margin-top:4px">${Number(p.price||0).toLocaleString()} ج.م</div>${isMe?`<button onclick="event.stopPropagation();delProp('${d.id}')" style="margin-top:6px;background:#ff44441a;color:#f55;border:none;padding:5px;border-radius:12px;font-size:9px;width:100%">حذف</button>`:``}</div></div>`;}).join('');
}catch(e){headEl.innerHTML=`<span style="color:#f55">${e.message}</span>`;}}
window.updateName=async()=>{const nn=document.getElementById('newName').value.trim();if(!nn) return alert('اكتب الاسم');try{await updateProfile(currentUser,{displayName:nn});const q=query(collection(db,"properties"),where("ownerId","==",currentUser.uid));const snap=await getDocs(q);for(const d of snap.docs) await updateDoc(doc(db,"properties",d.id),{ownerName:nn});alert('✅ تم');location.reload();}catch(e){alert(e.message);}};
window.updateAvatar=async(inp)=>{if(!inp.files[0]) return;try{const url=await uploadToImgBB(inp.files[0]);await updateProfile(currentUser,{photoURL:url});const q=query(collection(db,"properties"),where("ownerId","==",currentUser.uid));const snap=await getDocs(q);for(const d of snap.docs) await updateDoc(doc(db,"properties",d.id),{ownerPhoto:url});alert('✅ تم');location.reload();}catch(e){alert(e.message);}};
window.delProp=async(id)=>{if(!confirm('تمسح؟')) return;await deleteDoc(doc(db,"properties",id));location.reload();};
window.logout=async()=>{await signOut(auth);localStorage.clear();location.href='index.html';};
</script>
</body>
</html>
