<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إضافة عقار - AL TAKRURY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#D4AF37;--gold2:#B8962E;--black:#050507;--card:#0E0E10;--b:#1E1E22}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:#fff;padding-bottom:90px}
.header{height:60px;background:rgba(5,5,7,.96);border-bottom:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.btn{padding:8px 16px;border-radius:22px;font-weight:800;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000}
.btn-o{border:1px solid var(--gold);color:var(--gold);background:transparent}
.wrap{max-width:700px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid rgba(212,175,55,.2);border-radius:20px;padding:18px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.f{margin-bottom:12px}.f label{font-size:11px;color:#888;display:block;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;background:#121214;border:1px solid var(--b);border-radius:12px;padding:12px;color:#fff;outline:none;font-size:13px;min-height:46px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.upload{border:2px dashed #2A2B32;border-radius:16px;padding:18px;text-align:center;background:#121214;cursor:pointer}
.upload i{font-size:24px;color:var(--gold);display:block;margin-bottom:6px}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.preview img{width:100%;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--b)}
.submit{width:100%;height:52px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:26px;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;box-shadow:0 8px 20px rgba(212,175,55,.3)}
.progress{height:6px;background:#1E1E22;border-radius:10px;overflow:hidden;margin-top:10px;display:none}.progress div{height:100%;background:var(--gold);width:0%;transition:.3s}
</style>
</head>
<body>
<div class="header"><a href="index.html" class="btn btn-o"><i class="fa-solid fa-house"></i> AL TAKRURY</a><div style="color:var(--gold);font-weight:900">إضافة عقار</div><a href="profile.html" class="btn btn-gold" id="userBtn">حسابي</a></div>
<div class="wrap"><div class="card"><h2 style="font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px"><i class="fa-solid fa-plus" style="color:var(--gold)"></i> بيانات العقار - AL TAKRURY</h2>
<div class="f"><label>صور العقار - ImgBB مجانا</label><div class="upload" onclick="document.getElementById('fileInp').click()"><i class="fa-solid fa-cloud-arrow-up"></i><b style="font-size:13px">اضغط لرفع الصور</b><small style="color:#666;font-size:10px;display:block;margin-top:4px">أول صورة هي الرئيسية - الكروت هتكون مظبوطة</small><input type="file" id="fileInp" hidden accept="image/*" multiple></div><div class="preview" id="preview"></div><div class="progress" id="progWrap"><div id="prog"></div></div></div>
<div class="f"><label>عنوان العقار</label><input id="title" placeholder="مثال: شقة فاخرة - حدائق الهرم - AL TAKRURY"></div>
<div class="row"><div class="f"><label>المدينة</label><select id="city"><option>حدائق الهرم</option><option>القاهرة</option><option>الجيزة</option><option>أكتوبر</option><option>الشيخ زايد</option></select></div><div class="f"><label>نوع الصفقة</label><select id="deal"><option>للبيع</option><option>للإيجار</option></select></div></div>
<div class="row"><div class="f"><label>السعر</label><input id="price" type="number" placeholder="1000000"></div><div class="f"><label>المساحة</label><input id="area" type="number" placeholder="120"></div></div>
<div class="row"><div class="f"><label>غرف</label><input id="beds" type="number" value="3"></div><div class="f"><label>حمامات</label><input id="baths" type="number" value="2"></div></div>
<div class="row"><div class="f"><label>واتساب</label><input id="phone" value="01038204417"></div><div class="f"><label>نوع العقار</label><select id="type"><option>شقة</option><option>فيلا</option><option>محل</option><option>مكتب</option></select></div></div>
<div class="f"><label>الوصف</label><textarea id="desc" placeholder="تفاصيل العقار من التكروري..."></textarea></div>
<button class="submit" id="submitBtn"><i class="fa-solid fa-rocket"></i> نشر في AL TAKRURY الآن</button><div id="msg" style="text-align:center;margin-top:12px;font-size:12px"></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",authDomain:"hack1-cb0f2.firebaseapp.com",projectId:"hack1-cb0f2",storageBucket:"hack1-cb0f2.firebasestorage.app",messagingSenderId:"926645598259",appId:"1:926645598259:web:eabe7d3f588ee0b26f0b46"};
const IMGBB_KEY="4db587bdabc9b335c341251460d0d6e2";
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let currentUser=null;let uploadedUrls=[];
onAuthStateChanged(auth,user=>{currentUser=user;if(!user){const local=JSON.parse(localStorage.getItem('aqar_user')||'{}');if(!local.email){location.href='login.html';return;}currentUser={uid:local.id||'local',displayName:local.name,email:local.email,photoURL:null};}document.getElementById('userBtn').innerText=currentUser.displayName||'حسابي';});
const fileInp=document.getElementById('fileInp');const preview=document.getElementById('preview');const progWrap=document.getElementById('progWrap');const prog=document.getElementById('prog');
fileInp.addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length) return;preview.innerHTML='';uploadedUrls=[];progWrap.style.display='block';for(let i=0;i<files.length;i++){const file=files[i];const img=document.createElement('img');img.src=URL.createObjectURL(file);preview.appendChild(img);try{const fd=new FormData();fd.append("image",file);const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd});const data=await res.json();if(data.success){uploadedUrls.push(data.data.url);img.style.border='2px solid #25D366';}}catch(err){}prog.style.width=Math.round(((i+1)/files.length)*100)+'%';}document.getElementById('msg').innerHTML=`<span style="color:#25D366">✅ تم رفع ${uploadedUrls.length} صورة</span>`;});
document.getElementById('submitBtn').addEventListener('click',async()=>{const btn=document.getElementById('submitBtn');const msg=document.getElementById('msg');const title=document.getElementById('title').value.trim();const price=document.getElementById('price').value;if(!title||!price){alert('اكتب العنوان والسعر');return;}if(!uploadedUrls.length){alert('ارفع صورة');return;}btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';try{const docData={title,city:document.getElementById('city').value,deal:document.getElementById('deal').value,price:Number(price),area:Number(document.getElementById('area').value||0),bedrooms:Number(document.getElementById('beds').value||0),bathrooms:Number(document.getElementById('baths').value||0),phone:document.getElementById('phone').value,type:document.getElementById('type').value,desc:document.getElementById('desc').value,imageUrl:uploadedUrls[0],images:uploadedUrls,ownerId:currentUser.uid,ownerName:currentUser.displayName||currentUser.email,ownerEmail:currentUser.email||'',ownerPhoto:currentUser.photoURL||'',createdAt:serverTimestamp()};const ref=await addDoc(collection(db,"properties"),docData);msg.innerHTML='✅ تم النشر في AL TAKRURY!';setTimeout(()=>location.href='index.html',1000);}catch(e){msg.innerHTML=`<span style="color:#f55">${e.message}</span>`;btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-rocket"></i> نشر الآن';}});
</script>
</body>
</html>
