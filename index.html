<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AL TAKRURY - التكروري للاستثمار العقاري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#D4AF37;--gold2:#B8962E;--black:#050507;--card:#0E0E10;--b:#1E1E22}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:#fff;overflow-x:hidden}
.header{height:64px;background:#07070A;border-bottom:1px solid rgba(212,175,55,.18);display:flex;align-items:center;justify-content:space-between;padding:0 3%;position:sticky;top:0;z-index:1000}
.logo{display:flex;align-items:center;gap:0}
.logo-img{height:46px;width:auto;max-width:180px;object-fit:contain;display:block}
.nav{display:flex;gap:22px;font-size:12px;color:#888}
.nav a{cursor:pointer;padding:6px 0;border-bottom:2px solid transparent;transition:.2s}
.nav a.active,.nav a:hover{color:var(--gold);border-color:var(--gold)}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;padding:8px 16px;border-radius:22px;font-size:11px;font-weight:900}
.btn-o{border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:22px;font-size:11px;background:transparent}
.hero{position:relative;min-height:500px;background:#000;overflow:hidden;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920') center/cover}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#050507 0%,#050507 38%,rgba(5,5,7,.65) 70%,rgba(5,5,7,.1) 100%)}
.gold-curve{position:absolute;top:-15%;right:-6%;width:58%;height:130%;border:4px solid var(--gold);border-radius:50% 0 0 50%;border-right:none;z-index:2;pointer-events:none}
.hero-content{position:relative;z-index:3;width:50%;padding:40px 3%}
.hero-content h1{font-size:44px;font-weight:900;line-height:1.05}.hero-content h1 .white{color:#fff;display:block}.hero-content h1 .gold{color:var(--gold);display:block}
.divider{width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0;position:relative}.divider::after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);font-size:8px;background:var(--black);padding:0 6px}
.features{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}.feat{text-align:center;min-width:64px}.feat i{width:50px;height:50px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:17px;margin:auto;background:rgba(212,175,55,.08)}.feat b{display:block;color:var(--gold);font-size:11px;margin-top:6px}.feat span{display:block;color:#666;font-size:9px;max-width:80px}
.search-wrap{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);width:94%;max-width:1160px;background:rgba(14,14,16,.96);border:1px solid rgba(212,175,55,.35);border-radius:16px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 100px;gap:8px;z-index:10}
.sf{background:#121214;border:1px solid #222;border-radius:12px;padding:9px 11px}.sf small{color:#666;font-size:8px;display:block}.sf input,.sf select{width:100%;background:transparent;border:none;color:#fff;outline:none;font-size:11px;font-weight:700;margin-top:2px}
.search-btn{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.main-title{max-width:1280px;margin:56px auto 12px;padding:0 16px;display:flex;justify-content:space-between;align-items:center}.main-title h2{font-weight:900;font-size:20px}.main-title h2 span{color:var(--gold)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1280px;margin:10px auto;padding:0 16px}
.pcard{background:linear-gradient(145deg,#141416,#0E0E10);border:1px solid #1E1E22;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:360px;transition:.3s}.pcard:hover{border-color:var(--gold);transform:translateY(-5px)}
.pcard .th{height:180px;min-height:180px;position:relative;overflow:hidden;background:#08080A;flex-shrink:0}.pcard .th img{width:100%;height:100%;object-fit:cover}
.pcard .price{position:absolute;bottom:8px;left:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;padding:4px 12px;border-radius:18px;font-weight:900;font-size:10px}
.pcard .bd{padding:11px;display:flex;flex-direction:column;flex:1;justify-content:space-between}.pcard .bd-top h4{font-size:12.5px;font-weight:800;height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pcard .loc{font-size:9.5px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard .specs{display:flex;justify-content:space-between;font-size:9.5px;color:#7A7A82;border-top:1px solid #1A1A1E;padding-top:8px;margin-top:8px}
.btn-details{margin-top:8px;width:100%;height:34px;border:1px solid rgba(212,175,55,.6);border-radius:18px;background:transparent;color:var(--gold);font-size:10.5px;font-weight:800;cursor:pointer}
footer{background:#030304;border-top:1px solid rgba(212,175,55,.15);padding:14px 3%;display:flex;justify-content:space-between;font-size:10px;color:#666;flex-wrap:wrap;gap:8px}
@media(max-width:768px){.header{padding:8px 12px;height:58px}.logo-img{height:38px;max-width:150px}.nav{order:3;width:100%;justify-content:space-around;border-top:1px solid #15151A;padding-top:8px;margin-top:8px}.hero{flex-direction:column;min-height:auto}.hero-content{width:100%;padding:20px 16px 10px}.hero-content h1{font-size:28px}.gold-curve{width:100%;height:52%;top:auto;bottom:0;right:0;border-radius:50% 50% 0 0;border:4px solid var(--gold);border-bottom:none}.search-wrap{position:relative;transform:none;left:auto;width:calc(100% - 20px);margin:-18px auto 0;grid-template-columns:1fr 1fr}.search-btn{grid-column:1/-1}.card-grid{grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}.pcard{height:322px}.pcard .th{height:148px;min-height:148px}}
</style>
</head>
<body>
<div class="header">
<div class="logo"><img src="logo.png" class="logo-img" alt="AL TAKRURY"></div>
<div class="nav"><a class="active">الرئيسية</a><a onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">العقارات</a></div>
<div id="authArea"><a href="login.html" class="btn-o">دخول</a></div>
</div>
<div class="hero" id="hero"><div class="hero-bg"></div><div class="gold-curve"></div><div class="hero-content"><h1><span class="white">بيت أحلامك</span><span class="gold">استثمار مضمون</span></h1><div class="divider"></div><div class="features"><div class="feat"><i class="fa-solid fa-handshake"></i><b>ثقة</b></div><div class="feat"><i class="fa-solid fa-chart-line"></i><b>استثمار</b></div><div class="feat"><i class="fa-solid fa-house-chimney"></i><b>خبرة</b></div><div class="feat"><i class="fa-solid fa-key"></i><b>مستقبل</b></div></div></div></div>
<div class="search-wrap"><div class="sf"><small>المدينة</small><input id="sCity" placeholder="حدائق الهرم"></div><div class="sf"><small>النوع</small><select id="sType"><option value="">الكل</option><option>شقة</option><option>فيلا</option></select></div><div class="sf"><small>من</small><input id="sMin" type="number" placeholder="500000"></div><div class="sf"><small>إلى</small><input id="sMax" type="number" placeholder="5000000"></div><button class="search-btn" onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i> ابحث</button></div>
<div class="main-title"><h2>ـ كل <span>العقارات</span> ـ</h2><span id="count" style="color:var(--gold);font-size:11px"></span></div>
<div class="card-grid" id="grid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">جاري التحميل...</div></div>
<footer><div><span style="color:var(--gold)">AL TAKRURY</span> © 2026</div><div>0103 8204417</div></footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",authDomain:"hack1-cb0f2.firebaseapp.com",projectId:"hack1-cb0f2",storageBucket:"hack1-cb0f2.firebasestorage.app",messagingSenderId:"926645598259",appId:"1:926645598259:web:eabe7d3f588ee0b26f0b46"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);let all=[];
async function fetchProperties(){const q=query(collection(db,"properties"),orderBy("createdAt","desc"));const snap=await getDocs(q);all=snap.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('count').innerText=`${all.length} عقار`;render(all);}
window.doSearch=function(){const city=document.getElementById('sCity').value.toLowerCase();const type=document.getElementById('sType').value;const min=parseFloat(document.getElementById('sMin').value)||0;const max=parseFloat(document.getElementById('sMax').value)||Infinity;let list=all.filter(p=>{const price=Number(p.price)||0;return (p.city||'').toLowerCase().includes(city)&&(type==''||(p.title||'').includes(type))&&price>=min&&price<=max;});render(list);}
window.render=function(list){const grid=document.getElementById('grid');if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#666">لا يوجد</div>';return}grid.innerHTML=list.map(p=>{const img=p.imageUrl||'';const price=Number(p.price||0).toLocaleString('ar-EG');const title=(p.title||'').substring(0,48);return `<div class="pcard"><div class="th"><img src="${img}"><span class="price">${price} ج.م</span></div><div class="bd"><div class="bd-top"><h4>${title}</h4><div class="loc"><i class="fa-solid fa-location-dot" style="color:var(--gold)"></i> ${p.city||''}</div></div><div><div class="specs"><span>${p.area||0} م²</span><span>${p.bedrooms||0} غرف</span><span>${p.bathrooms||0} حمام</span></div><button class="btn-details" onclick="location.href='details.html?id=${p.id}'">عرض التفاصيل →</button></div></div></div>`}).join('');}
onAuthStateChanged(auth,u=>{if(u)document.getElementById('authArea').innerHTML=`<a href="profile.html" class="btn-o">${u.displayName||'حسابي'}</a>`;});
fetchProperties();
</script>
</body>
</html>
