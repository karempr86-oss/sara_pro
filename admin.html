<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - Firebase</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD400;--bg:#08080A;--card:#141416}
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:var(--bg);color:#fff;margin:0}
#login{position:fixed;inset:0;background:#08080A;display:flex;align-items:center;justify-content:center;z-index:999}
#loginBox{background:#141416;border:1px solid #333;padding:30px;border-radius:20px;width:360px;text-align:center}
#loginBox input{width:100%;padding:12px;background:#1f1f1f;border:1px solid #333;border-radius:10px;color:#fff;margin:10px 0}
#main{display:none;padding:20px;max-width:900px;margin:auto}
input,select,textarea{padding:12px;background:#1f1f1f;border:1px solid #333;border-radius:8px;color:#fff;width:100%;margin:5px 0}
textarea{height:80px}
.btn-yellow{background:var(--y);color:#000;font-weight:800;border:none;padding:12px;border-radius:8px;cursor:pointer}
.card{background:var(--card);border:1px solid #222;border-radius:12px;padding:12px;display:flex;gap:12px;margin-bottom:10px}
.card img{width:90px;height:70px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div id="login">
<div id="loginBox">
<h2 style="color:var(--y)">🔒 دخول الإدارة</h2>
<input id="email" placeholder="ايميل الادمن">
<input type="password" id="pass" placeholder="الباسورد">
<button onclick="check()" class="btn-yellow" style="width:100%">دخول</button>
<p style="font-size:11px;color:#888;margin-top:10px">او باسورد الطوارئ: sara.com</p>
<p id="err" style="color:#f44;display:none;margin-top:10px"></p>
</div>
</div>

<div id="main">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="color:var(--y)">🏠 لوحة التحكم - Firebase</h2>
<div style="display:flex;gap:8px"><span id="adminEmail" style="font-size:12px;color:#888"></span>
<button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:8px">خروج</button></div>
</div>

<div style="background:#141416;padding:20px;border-radius:14px;margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="title" placeholder="عنوان العقار" style="grid-column:1/-1">
<select id="city"><option>القاهرة</option><option>الشيخ زايد</option><option>6 أكتوبر</option><option>الاسكندرية</option><option>المنصورة</option></select>
<select id="deal"><option value="للبيع">للبيع</option><option value="للإيجار">للإيجار</option></select>
<input id="price" type="number" placeholder="السعر">
<input id="area" type="number" placeholder="المساحة م²">
<input id="bedrooms" type="number" placeholder="عدد الغرف">
<input id="bathrooms" type="number" placeholder="حمامات">
<input id="phone" placeholder="رقم الواتساب" style="grid-column:1/-1">
<textarea id="description" placeholder="وصف العقار..." style="grid-column:1/-1"></textarea>
<input type="file" id="image" accept="image/*" style="grid-column:1/-1">
<button class="btn-yellow" style="grid-column:1/-1" onclick="add()" id="addBtn">🚀 نشر العقار</button>
</div>

<div style="display:flex;justify-content:space-between;margin-bottom:10px">
<span id="total" style="color:var(--y)"></span>
<button onclick="load()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:8px;font-size:12px">🔄 تحديث</button>
</div>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",
  authDomain: "hack1-cb0f2.firebaseapp.com",
  projectId: "hack1-cb0f2",
  storageBucket: "hack1-cb0f2.firebasestorage.app",
  messagingSenderId: "926645598259",
  appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46",
  measurementId: "G-0ESMXPYWXC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_EMAILS = ["admin@aqarat.com","karem@gmail.com"]; // ضيف ايميلك هنا
const EMERGENCY_PASS = "sara.com";

let currentUser=null;

// لو مسجل دخول قبل كده
onAuthStateChanged(auth,(user)=>{
  if(user){
    currentUser=user;
    if(ADMIN_EMAILS.length>0 &&!ADMIN_EMAILS.includes(user.email) && user.email!== "admin@aqarat.com"){
      // لو عايز تسمح لاي حد مسجل يدخل كادمن، شيل الشرط ده
      // حاليا اي حد مسجل يقدر يدخل - عشان انت لسه بتجرب
    }
    show();
  }
});

window.check = async ()=>{
  const e=document.getElementById('email').value.trim();
  const p=document.getElementById('pass').value.trim();
  const err=document.getElementById('err');
  // دخول طوارئ بالباسورد القديم
  if(p===EMERGENCY_PASS &&!e){
    sessionStorage.setItem('admin_emergency','1');
    show(); return;
  }
  if(!e||!p){err.style.display='block'; err.innerText='اكتب الايميل والباسورد'; return;}
  try{
    const cred=await signInWithEmailAndPassword(auth,e,p);
    currentUser=cred.user;
    show();
  }catch(ex){
    err.style.display='block';
    err.innerText='بيانات غلط: '+ex.message;
  }
};

function show(){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';
  const em=currentUser?currentUser.email:'ادمن (طوارئ)';
  document.getElementById('adminEmail').innerText=em;
  load();
}
window.logout=()=>{signOut(auth); sessionStorage.clear(); location.reload();}

let file=null;
document.getElementById('image').addEventListener('change', e=> file=e.target.files[0]);

window.add = async ()=>{
  const btn=document.getElementById('addBtn');
  if(!title.value.trim()){alert('اكتب العنوان'); return;}
  btn.disabled=true; btn.innerText='جاري النشر...';
  try{
    let imageUrl='';
    if(file){
      const storageRef=ref(storage,'properties/'+Date.now()+'_'+file.name);
      await uploadBytes(storageRef,file);
      imageUrl=await getDownloadURL(storageRef);
    }
    await addDoc(collection(db,'properties'),{
      title:title.value.trim(),
      city:city.value,
      deal:deal.value,
      price:Number(price.value)||0,
      area:Number(area.value)||0,
      bedrooms:Number(bedrooms.value)||0,
      bathrooms:Number(bathrooms.value)||0,
      phone:phone.value.trim(),
      description:description.value.trim(),
      main_image:imageUrl,
      approved:true,
      created:serverTimestamp(),
      createdBy: currentUser?currentUser.email:'admin'
    });
    alert('✅ تم النشر وظهر في index.html فورا');
    title.value=''; price.value=''; area.value=''; bedrooms.value=''; bathrooms.value=''; phone.value=''; description.value=''; document.getElementById('image').value=''; file=null;
    load();
  }catch(e){alert('خطأ: '+e.message);}
  btn.disabled=false; btn.innerText='🚀 نشر العقار';
};

window.load = async ()=>{
  const list=document.getElementById('list'), total=document.getElementById('total');
  list.innerHTML='جاري التحميل...';
  try{
    const q=query(collection(db,'properties'), orderBy('created','desc'));
    const snap=await getDocs(q);
    total.innerText=`إجمالي العقارات: ${snap.size}`;
    if(snap.empty){list.innerHTML='<p style="color:#888;text-align:center">مفيش عقارات</p>'; return;}
    list.innerHTML='';
    snap.forEach(docSnap=>{
      const p=docSnap.data(); const id=docSnap.id;
      const img=p.main_image||'https://via.placeholder.com/90';
      const div=document.createElement('div');
      div.className='card';
      div.innerHTML=`<img src="${img}"><div style="flex:1"><b>${p.title}</b><br><small style="color:#888">${p.city} - ${p.price}ج - ${p.area||0}م² - ${p.bedrooms||0}غرف<br>${(p.description||'').slice(0,80)}</small><div style="margin-top:6px;display:flex;gap:6px"><button onclick="del('${id}')" style="background:#f44;color:#fff;border:none;padding:5px 10px;border-radius:6px">حذف نهائي من Firebase</button><a href="details.html?id=${id}" target="_blank" style="background:#333;color:#fff;padding:5px 10px;border-radius:6px;text-decoration:none">معاينة</a></div></div>`;
      list.appendChild(div);
    });
  }catch(e){list.innerHTML='خطأ: '+e.message+'<br>اتأكد انك فعلت Firestore في Firebase Console';}
};

window.del = async (id)=>{
  if(!confirm('⚠️ هتمسح العقار نهائي من Firebase ومش هيظهر في index.html تاني؟')) return;
  try{
    await deleteDoc(doc(db,'properties',id));
    alert('تم المسح ✅');
    load();
  }catch(e){alert('فشل المسح: '+e.message);}
};
</script>
</body>
</html>
