<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFD400;
            --bg: #08080A;
            --card: #141416
        }

        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: #fff;
            margin: 0
        }

        #login {
            position: fixed;
            inset: 0;
            background: #08080A;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999
        }

        #loginBox {
            background: #141416;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center
        }

        #loginBox input {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            margin: 10px 0
        }

        #main {
            display: none;
            padding: 20px
        }

        input,
        select,
        textarea {
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            width: 100%;
            margin: 5px 0
        }

        textarea {
            height: 80px
        }

        .btn-yellow {
            background: var(--yellow);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer
        }

        .card {
            background: var(--card);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            margin-bottom: 10px
        }

        .card img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px
        }
    </style>
</head>

<body>
    <div id="login">
        <div id="loginBox">
            <h2 style="color:var(--yellow)">🔒 دخول الإدارة</h2><input type="password" id="pass"
                placeholder="الباسورد"><button onclick="check()" class="btn-yellow" style="width:100%">دخول</button>
            <p id="err" style="color:#f44;display:none">باسورد غلط</p>
        </div>
    </div>
    <div id="main">
        <div style="display:flex;justify-content:space-between">
            <h2 style="color:var(--yellow)">🏠 لوحة التحكم المتطورة</h2><button onclick="logout()"
                style="background:#222;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:8px">خروج</button>
        </div>
        <div
            style="background:#141416;padding:20px;border-radius:14px;max-width:700px;margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <input id="title" placeholder="عنوان العقار" style="grid-column:1/-1"><select id="city">
                <option>القاهرة</option>
                <option>الشيخ زايد</option>
                <option>6 أكتوبر</option>
                <option>الاسكندرية</option>
            </select><select id="deal">
                <option value="للبيع">للبيع</option>
                <option value="للإيجار">للإيجار</option>
            </select><input id="price" type="number" placeholder="السعر"><input id="area" type="number"
                placeholder="المساحة م²"><input id="bedrooms" type="number" placeholder="عدد الغرف"><input
                id="bathrooms" type="number" placeholder="حمامات"><input id="phone" placeholder="رقم الواتساب"
                style="grid-column:1/-1"><textarea id="description" placeholder="وصف العقار بالتفصيل..."
                style="grid-column:1/-1"></textarea><input type="file" id="image" style="grid-column:1/-1"><button
                class="btn-yellow" style="grid-column:1/-1" onclick="add()">🚀 نشر العقار</button></div>
        <div style="display:flex;gap:10px;margin-bottom:10px"><span id="total" style="color:var(--yellow)"></span></div>
        <div id="list"></div>
    </div>
    <script>
        const PASS = 'sara.com'; const PB = 'http://127.0.0.1:8090'; let file = null;
        if (sessionStorage.getItem('a') === PASS) show(); function check() {if (document.getElementById('pass').value === PASS) {sessionStorage.setItem('a', PASS); show()} else document.getElementById('err').style.display = 'block'} function show() {document.getElementById('login').style.display = 'none'; document.getElementById('main').style.display = 'block'; load()} function logout() {sessionStorage.removeItem('a'); location.reload()}
        document.getElementById('image').addEventListener('change', e => file = e.target.files[0]);
        async function add() {const fd = new FormData(); fd.append('title', title.value); fd.append('city', city.value); fd.append('price', price.value); fd.append('deal', deal.value); fd.append('area', area.value); fd.append('bedrooms', bedrooms.value); fd.append('bathrooms', bathrooms.value); fd.append('phone', phone.value); fd.append('description', description.value); fd.append('approved', true); if (file) fd.append('main_image', file); await fetch(`${PB}/api/collections/properties/records`, {method: 'POST', body: fd}); alert('تم النشر!'); load()}
        async function load() {const r = await fetch(`${PB}/api/collections/properties/records?sort=-created&perPage=200`); const d = await r.json(); document.getElementById('total').innerText = `إجمالي العقارات: ${d.items.length}`; document.getElementById('list').innerHTML = d.items.map(p => {const img = p.main_image ? `${PB}/api/files/properties/${p.id}/${p.main_image}` : 'https://via.placeholder.com/90'; return `<div class="card"><img src="${img}"><div style="flex:1"><b>${p.title}</b><br><small style="color:#888">${p.city} - ${p.price}ج - ${p.area || 0}م² - ${p.bedrooms || 0}غرف<br>${p.description || ''}</small><div style="margin-top:6px;display:flex;gap:6px"><button onclick="del('${p.id}')" style="background:#f44;color:#fff;border:none;padding:5px 10px;border-radius:6px">حذف</button><a href="details.html?id=${p.id}" target="_blank" style="background:#333;color:#fff;padding:5px 10px;border-radius:6px;text-decoration:none">معاينة</a></div></div></div>`}).join('')}
        async function del(id) {if (!confirm('حذف؟')) return; await fetch(`${PB}/api/collections/properties/records/${id}`, {method: 'DELETE'}); load()}
    </script>
</body>

</html>
