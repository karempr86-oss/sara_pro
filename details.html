<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل العقار - عقارات برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--y:#FFD400;--bg:#07080A;--c:#0E0F12;--b:#1E1F25}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:var(--bg);color:#fff}
.header{height:60px;background:#08090B;border-bottom:1px solid #15161B;display:flex;align-items:center;justify-content:space-between;padding:0 3%;position:sticky;top:0}
.btn{padding:8px 16px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none}
.btn-y{background:var(--y);color:#000}
.btn-o{border:1px solid var(--y);color:var(--y)}
.container{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:1.5fr .9fr;gap:16px}
@media(max-width:800px){.container{grid-template-columns:1fr}}
.img-box{background:var(--c);border:1px solid var(--b);border-radius:16px;overflow:hidden}
.img-box img{width:100%;height:380px;object-fit:cover;display:block}
.info{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px}
.price{color:var(--y);font-size:22px;font-weight:900;margin:8px 0}
.spec{display:flex;gap:12px;margin:12px 0;color:#9A9CA3;font-size:12px}
.spec span{background:#121316;border:1px solid var(--b);padding:6px 10px;border-radius:10px}
.owner{display:flex;align-items:center;gap:10px;background:#121316;border:1px solid var(--b);border-radius:12px;padding:10px;margin-top:14px}
.owner img{width:42px;height:42px;border-radius:50%;border:1px solid var(--y)}
.whats{width:100%;height:44px;background:#25D366;color:#fff;border:none;border-radius:22px;font-weight:900;margin-top:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="btn-o">← رجوع</a>
<div style="color:var(--y);font-weight:900">عقارات برو</div>
<a href="profile.html" class="btn-y">الملف</a>
</div>

<div class="container" id="content">
<div style="grid-column:1/-1;text-align:center;padding:60px;color:#666">جاري تحميل العقار...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",
  authDomain: "hack1-cb0f2.firebaseapp.com",
  projectId: "hack1-cb0f2",
  storageBucket: "hack1-cb0f2.firebasestorage.app",
  messagingSenderId: "926645598259",
  appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(location.search).get('id');
const content = document.getElementById('content');

if(!id){ content.innerHTML = 'لا يوجد ID'; }

async function load(){
  try{
    const ref = doc(db, "properties", id);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      // جرب localStorage
      const local = JSON.parse(localStorage.getItem('aqar_properties')||'[]').find(p=>p.id==id);
      if(local) return render(local);
      content.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#f55">العقار غير موجود</div>';
      return;
    }
    render({id: snap.id, ...snap.data()});
  }catch(e){
    console.error(e);
    content.innerHTML = 'خطأ: '+e.message;
  }
}

function render(p){
  const img = p.imageUrl || p.main_image || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800';
  const price = Number(p.price||0).toLocaleString('ar-EG');
  content.innerHTML = `
    <div class="img-box"><img src="${img}"></div>
    <div class="info">
      <h2 style="font-weight:900">${p.title||'عقار مميز'}</h2>
      <div style="color:#888;font-size:12px;margin-top:4px"><i class="fa-solid fa-location-dot"></i> ${p.city||''}</div>
      <div class="price">${price} ج.م - ${p.deal||'للبيع'}</div>
      <div class="spec">
        <span><i class="fa-solid fa-ruler"></i> ${p.area||0} م²</span>
        <span>${p.bedrooms||0} غرف</span>
        <span>${p.bathrooms||0} حمام</span>
      </div>
      <p style="font-size:12px;color:#bbb;line-height:1.9;margin-top:10px">${p.desc||'لا يوجد وصف'}</p>
      
      <div class="owner">
        <img src="${p.ownerPhoto||'https://ui-avatars.com/api/?name='+encodeURIComponent(p.ownerName||'مالك')+'&background=FFD400&color=000'}">
        <div>
          <div style="font-weight:800;font-size:12px">${p.ownerName||'مالك العقار'}</div>
          <div style="font-size:10px;color:#777">${p.ownerEmail||''}</div>
        </div>
      </div>

      <button class="whats" onclick="window.open('https://wa.me/${(p.phone||'').replace(/[^0-9]/g,'')}?text=السلام عليكم مهتم بعقار ${encodeURIComponent(p.title||'')}', '_blank')"><i class="fa-brands fa-whatsapp"></i> تواصل واتساب - ${p.phone||''}</button>
      <a href="tel:${p.phone||''}" style="display:block;text-align:center;margin-top:8px;color:#888;font-size:11px">اتصال مباشر</a>
    </div>
  `;
}
load();
</script>
</body>
</html>
