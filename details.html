<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل - AL TAKRURY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#D4AF37;--gold2:#B8962E;--black:#050507;--card:#0E0E10;--b:#1E1E22}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:var(--black);color:#fff;padding-bottom:90px}
.header{height:62px;background:rgba(5,5,7,.96);border-bottom:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{width:44px;height:44px;object-fit:contain;border-radius:10px;border:1px solid rgba(212,175,55,.3)}
.btn{padding:8px 16px;border-radius:22px;font-weight:800;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000}.btn-o{border:1px solid var(--gold);color:var(--gold);background:transparent}
.container{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1.6fr.9fr;gap:14px}
.img-box{background:var(--card);border:1px solid rgba(212,175,55,.15);border-radius:18px;overflow:hidden;position:relative}.img-box img{width:100%;height:420px;object-fit:cover;display:block}
.info{background:var(--card);border:1px solid rgba(212,175,55,.2);border-radius:18px;padding:18px;height:fit-content;position:sticky;top:74px}
.price{color:var(--gold);font-size:22px;font-weight:900;margin:8px 0}.spec{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.spec span{background:#121214;border:1px solid var(--b);padding:8px 12px;border-radius:12px;font-size:11px;color:#aaa}
.owner{display:flex;align-items:center;gap:10px;background:#121214;border:1px solid var(--b);border-radius:14px;padding:12px;margin-top:16px;cursor:pointer}.owner img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.whats{width:100%;height:48px;background:#25D366;color:#fff;border:none;border-radius:24px;font-weight:900;margin-top:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.call{width:100%;height:44px;background:transparent;border:1px solid var(--b);color:#fff;border-radius:24px;font-weight:700;margin-top:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
@media(max-width:900px){.container{grid-template-columns:1fr}.img-box img{height:260px}.info{position:relative;top:auto}.whats{position:fixed;bottom:14px;left:12px;right:12px;width:auto;z-index:999}.call{margin-bottom:70px}}
</style>
</head>
<body>
<div class="header"><a href="index.html" class="btn btn-o"><i class="fa-solid fa-arrow-right"></i> رجوع</a><div class="logo"><img src="logo.png" class="logo.img"><b style="color:var(--gold)">AL TAKRURY</b></div><a href="profile.html" class="btn btn-gold">حسابي</a></div>
<div class="container" id="content"><div style="grid-column:1/-1;text-align:center;padding:80px;color:#666"><i class="fa-solid fa-spinner fa-spin" style="font-size:28px;display:block;margin-bottom:10px"></i>جاري التحميل...</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",authDomain:"hack1-cb0f2.firebaseapp.com",projectId:"hack1-cb0f2",storageBucket:"hack1-cb0f2.firebasestorage.app",messagingSenderId:"926645598259",appId:"1:926645598259:web:eabe7d3f588ee0b26f0b46"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const id=new URLSearchParams(location.search).get('id');const content=document.getElementById('content');
async function load(){const snap=await getDoc(doc(db,"properties",id));if(!snap.exists()){content.innerHTML='غير موجود';return;}const p={id:snap.id,...snap.data()};const img=p.imageUrl||'';const price=Number(p.price||0).toLocaleString('ar-EG');const phoneClean=(p.phone||'').replace(/[^0-9]/g,'');content.innerHTML=`<div class="img-box"><img src="${img}"></div><div class="info"><h2 style="font-weight:900">${p.title}</h2><div style="color:#777;font-size:12px;margin-top:6px"><i class="fa-solid fa-location-dot" style="color:var(--gold)"></i> ${p.city}</div><div class="price">${price} ج.م</div><div class="spec"><span>${p.area||0} م²</span><span>${p.bedrooms||0} غرف</span><span>${p.bathrooms||0} حمام</span><span style="background:var(--gold);color:#000;font-weight:800">${p.type||''}</span></div><p style="font-size:12px;color:#aaa;line-height:2;margin-top:12px;background:#121214;border:1px solid var(--b);border-radius:12px;padding:12px">${p.desc||''}</p><button class="whats" onclick="window.open('https://wa.me/${phoneClean}?text=مهتم بعقار ${encodeURIComponent(p.title)}','_blank')"><i class="fa-brands fa-whatsapp"></i> واتساب - ${p.phone}</button><button class="call" onclick="location.href='tel:${p.phone}'"><i class="fa-solid fa-phone"></i> اتصال</button></div>`;}
load();
</script>
</body>
</html>
