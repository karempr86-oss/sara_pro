<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --y: #FFD400;
            --bg: #07080A;
            --c: #0E0F12;
            --b: #1E1F25
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif
        }

        body {
            background: var(--bg);
            color: #fff;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0
        }

        .box {
            background: var(--c);
            border: 1px solid rgba(255, 212, 0, .25);
            border-radius: 14px;
            padding: 28px;
            width: 100%;
            max-width: 380px
        }

        input {
            width: 100%;
            height: 46px;
            background: #08090A;
            border: 1px solid var(--b);
            border-radius: 22px;
            padding: 0 16px;
            color: #fff;
            outline: none;
            margin-top: 12px;
            font-size: 12px
        }

        button {
            width: 100%;
            height: 46px;
            border-radius: 22px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            margin-top: 14px;
            background: var(--y);
            color: #000
        }
    </style>
</head>

<body>
    <div class="box">
        <div style="color:var(--y);font-weight:900;font-size:20px">عقارات برو</div>
        <h2 style="margin-top:10px">تسجيل الدخول</h2><input id="email" placeholder="الإيميل"><input id="pass"
            type="password" placeholder="الباسورد"><button onclick="login()" id="b">دخول</button>
        <p id="m" style="font-size:11px;text-align:center;margin-top:8px"></p>
        <p style="text-align:center;font-size:11px;color:#666;margin-top:12px">معندكش حساب؟ <a href="register.html"
                style="color:var(--y)">إنشاء حساب</a></p>
    </div>
    <script>const PB = `http://${location.hostname}:8090`; async function login() { b.disabled = true; b.innerText = 'جاري...'; try { const r = await fetch(`${PB}/api/collections/users/auth-with-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identity: email.value, password: pass.value }) }); if (!r.ok) throw ''; const d = await r.json(); localStorage.setItem('pb_token', d.token); localStorage.setItem('pb_user', JSON.stringify(d.record)); location.href = 'index.html' } catch { m.style.color = '#f55'; m.innerText = 'بيانات غلط'; b.disabled = false; b.innerText = 'دخول' } }</script>
</body>

</html>
