<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - عقارات برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD400;--bg:#07080A;--c:#0E0F12;--b:#1E1F25}
*{box-sizing:border-box;font-family:'Cairo'}
body{background:var(--bg);color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
.box{background:var(--c);border:1px solid rgba(255,212,0,.25);border-radius:14px;padding:28px;width:100%;max-width:380px}
input{width:100%;height:46px;background:#08090A;border:1px solid var(--b);border-radius:22px;padding:0 16px;color:#fff;outline:none;margin-top:12px;font-size:12px}
button{width:100%;height:46px;border-radius:22px;border:none;font-weight:900;cursor:pointer;margin-top:14px;background:var(--y);color:#000}
button:disabled{opacity:.6}
.google-btn{background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #ddd;margin-top:12px}
.google-btn img{width:20px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#666;font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1E1F25}
</style>
</head>
<body>
<div class="box">
<div style="color:var(--y);font-weight:900;font-size:20px">عقارات برو</div>
<h2 style="margin-top:10px">إنشاء حساب جديد</h2>

<input id="name" placeholder="اسمك الكامل">
<input id="email" placeholder="الإيميل">
<input id="pass" type="password" placeholder="الباسورد (6 حروف على الأقل)">
<input id="pass2" type="password" placeholder="تأكيد الباسورد">

<button onclick="register()" id="b">إنشاء حساب</button>

<div class="divider">أو</div>

<button class="google-btn" onclick="registerGoogle()" id="gBtn">
<img src="https://www.svgrepo.com/show/475656/google-color.svg"> تسجيل بجوجل
</button>

<p id="m" style="font-size:11px;text-align:center;margin-top:8px"></p>
<p style="text-align:center;font-size:11px;color:#666;margin-top:12px">عندك حساب؟ <a href="login.html" style="color:var(--y)">دخول</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50",
  authDomain: "hack1-cb0f2.firebaseapp.com",
  projectId: "hack1-cb0f2",
  storageBucket: "hack1-cb0f2.firebasestorage.app",
  messagingSenderId: "926645598259",
  appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46",
  measurementId: "G-0ESMXPYWXC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.register = async ()=>{
  const b=document.getElementById('b'), m=document.getElementById('m');
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value.trim();
  const pass2=document.getElementById('pass2').value.trim();

  if(!name){m.style.color='#f55'; m.innerText='اكتب اسمك'; return;}
  if(pass!==pass2){m.style.color='#f55'; m.innerText='الباسورد مش متطابق'; return;}
  if(pass.length<6){m.style.color='#f55'; m.innerText='الباسورد لازم 6 حروف'; return;}

  b.disabled=true; b.innerText='جاري...'; m.innerText='';
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    localStorage.setItem('user', JSON.stringify({uid:cred.user.uid,email:cred.user.email,name:name}));
    localStorage.setItem('firebase_token', await cred.user.getIdToken());
    m.style.color='#0f0'; m.innerText='تم إنشاء الحساب بنجاح';
    setTimeout(()=> location.href='index.html', 700);
  }catch(e){
    m.style.color='#f55';
    if(e.code==='auth/email-already-in-use') m.innerText='الايميل ده معمول قبل كده';
    else if(e.code==='auth/invalid-email') m.innerText='الايميل غلط';
    else m.innerText=e.message;
    b.disabled=false; b.innerText='إنشاء حساب';
  }
};

window.registerGoogle = async ()=>{
  const gBtn=document.getElementById('gBtn'), m=document.getElementById('m');
  gBtn.disabled=true; gBtn.innerHTML='جاري...';
  try{
    const result = await signInWithPopup(auth, provider);
    const user=result.user;
    localStorage.setItem('user', JSON.stringify({uid:user.uid,email:user.email,name:user.displayName,photo:user.photoURL}));
    localStorage.setItem('firebase_token', await user.getIdToken());
    m.style.color='#0f0'; m.innerText='تم التسجيل بجوجل';
    setTimeout(()=> location.href='index.html', 600);
  }catch(e){
    m.style.color='#f55'; m.innerText='فشل: '+e.message;
    gBtn.disabled=false; gBtn.innerHTML='<img src="https://www.svgrepo.com/show/475656/google-color.svg"> تسجيل بجوجل';
  }
};
</script>
</body>
</html>
